name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release and Upload Linux Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "InvoiceFine ${{ github.ref_name || inputs.tag_name }} — Linux Desktop Release"
          body_path: RELEASES-NOTE.md
          draft: false
          prerelease: false
          files: |
            downloads/linux/InvoiceFine_1.2.0_amd64.deb
            downloads/linux/InvoiceFine-1.2.0-1.x86_64.rpm
