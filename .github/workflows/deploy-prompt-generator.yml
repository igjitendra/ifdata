name: Deploy Prompt Generator to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'prompt-generator/**'
      - '.github/workflows/deploy-prompt-generator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prompt-generator/package-lock.json

      - name: Install dependencies
        working-directory: prompt-generator
        run: npm ci

      - name: Build static export
        working-directory: prompt-generator
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: "/ifdata"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prompt-generator/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
